server:
  port: 8080
  error:
    include-message: always
    include-stacktrace: never

spring:
  application:
    name: ai-review-assistant
  mvc:
    favicon:
      enabled: false

  # PostgreSQL 数据库配置
  # 统一连接 Docker 中的 pgvector PostgreSQL (docker-compose.yml)
  # 本机 Homebrew PostgreSQL 已卸载，勿再安装本机实例以免占用 5432 端口
  datasource:
    url: jdbc:postgresql://localhost:5432/review_db?currentSchema=public&connectTimeout=60&socketTimeout=60
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 20000

  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:}
      chat:
        options:
          # 模型名称由 ai.model.name 统一接管，此处保留默认值作为 fallback
          model: qwen-plus
          temperature: 0.9
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1536
        initialize-schema: true
        max-document-batch-size: 1000
  servlet:
    multipart:
      enabled: true              # 启用文件上传
      max-file-size: 10MB        # 单个文件最大大小
      max-request-size: 10MB     # 请求最大大小

# 统一模型配置：切换模型只需改 ai.model.name
ai:
  model:
    provider: dashscope
    name: qwen-plus
    # 快速模型：用于出题等对速度敏感的场景（qwen-turbo 出题速度约为 qwen-plus 的 4-5 倍）
    fast-name: qwen-turbo
    temperature: 0.9

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto

# 业务配置
app:
  jwt:
    secret: ${JWT_SECRET:ai-review-assistant-jwt-secret-key-2024-change-in-production-please-use-a-longer-secret-key-256bits-minimum}
    access-expiration-ms: 900000      # 15分钟
    refresh-expiration-ms: 604800000   # 7天
  conversation:
    expire-days: 30  # 会话过期天数，超过后自动清理
  stats:
    # 闲聊（你好/谢谢等社交性对话）不计入复习统计，避免虚增复习次数与综合评分
    # 与课程相关的实质问答仍会正常统计
    skip-casual-chat: true
  rag:
    top-k: 3                      # RAG 默认召回数量
    # 相似度阈值 0.55：实测（DashScope text-embedding + 本库 25 分块）分数呈双峰分布——
    #   真实命中：0.577 / 0.595 / 0.845   无关“擦边”内容：0.504~0.528
    # 0.55 恰好位于二者之间：能挡住“链表→二叉搜索树”这类同专业但不同知识点的误召回，
    # 同时保留全部真实命中。调低到 0.5 会重新引入误报，调高到 0.6 会丢失真实命中。
    similarity-threshold: 0.55
    rerank-enabled: true          # 是否启用关键词重排序
    # 候选倍数 3：同一资料可能被导入多个课程，按内容去重后需要更多候选
    # 才能用不同的片段填满 TopK（倍数过小会导致最终只剩 1 条不同片段）
    rerank-candidate-multiplier: 3

# Actuator 与 Micrometer 配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      show-components: always
    metrics:
      enabled: true
    prometheus:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}