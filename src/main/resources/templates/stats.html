<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>统计 - AI Review Assistant</title>
    <link rel="stylesheet" href="/css/common.css">
    <style>
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        .stat-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 24px;
            text-align: center;
            box-shadow: var(--shadow-sm);
        }
        .stat-card .accent {
            width: 100%;
            height: 3px;
            border-radius: 2px;
            margin-bottom: 14px;
        }
        .stat-card .accent.indigo { background: var(--primary); }
        .stat-card .accent.green { background: var(--success); }
        .stat-card .accent.orange { background: var(--warning); }
        .stat-card .accent.red { background: var(--danger); }
        .stat-card .num { font-size: 32px; font-weight: 700; }
        .stat-card .num.indigo { color: var(--primary); }
        .stat-card .num.green { color: var(--success); }
        .stat-card .num.orange { color: var(--warning); }
        .stat-card .num.red { color: var(--danger); }
        .stat-card .label { font-size: 13px; color: var(--text-muted); margin-top: 6px; }
        .wrong-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 16px 20px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
        }
        .wrong-card .q { font-size: 14px; line-height: 1.7; flex: 1; }
        .wrong-card .ans { font-size: 13px; color: var(--text-muted); margin-top: 5px; }
        .wrong-card .actions { display: flex; gap: 6px; flex-shrink: 0; }
        .empty { text-align: center; padding: 48px; color: var(--text-muted); font-size: 14px; }
    </style>
</head>
<body>
<nav class="navbar">
    <div class="navbar-inner">
        <a class="navbar-brand" href="/"><span class="brand-icon">📚</span>AI Review Assistant</a>
        <div class="nav-links">
            <a href="/">💬 对话</a>
            <a href="/courses.html">📖 课程</a>
            <a href="/knowledge.html">📚 知识库</a>
            <a href="/quiz.html">📝 测验</a>
            <a href="/plan.html">📅 计划</a>
            <a class="active" href="/stats.html">📊 统计</a>
            <div class="nav-user">
                <span class="nav-avatar" id="userAvatar">G</span>
                <span class="nav-nickname" id="userNickname">访客</span>
            </div>
            <button class="nav-logout" onclick="logout()" id="logoutBtn" style="display:none">退出</button>
        </div>
    </div>
</nav>
<div class="page-body">
    <div class="stats-grid" id="statsGrid">
        <div class="stat-card"><div class="accent indigo"></div><div class="num indigo" id="sScore">-</div><div class="label">总分</div></div>
        <div class="stat-card"><div class="accent green"></div><div class="num green" id="sReviews">-</div><div class="label">复习次数</div></div>
        <div class="stat-card"><div class="accent orange"></div><div class="num orange" id="sDays">-</div><div class="label">活跃天数</div></div>
        <div class="stat-card"><div class="accent indigo"></div><div class="num indigo" id="sStreak">-</div><div class="label">连续天数</div></div>
        <div class="stat-card"><div class="accent green"></div><div class="num green" id="sCourses">-</div><div class="label">已复习课程</div></div>
        <div class="stat-card"><div class="accent red"></div><div class="num red" id="sWrong">-</div><div class="label">错题数</div></div>
    </div>
    <div class="card">
        <div class="card-header">
            <div class="card-title"><span class="title-icon">📕</span>错题本</div>
        </div>
        <div class="tabs">
            <button class="active" onclick="loadWrong(false,this)">未掌握</button>
            <button onclick="loadWrong(true,this)">已掌握</button>
            <button onclick="loadWrong(null,this)">全部</button>
        </div>
        <div id="wrongList"><div class="empty">暂无错题</div></div>
    </div>
</div>
<script>
const token=localStorage.getItem('token');
document.addEventListener('DOMContentLoaded',()=>{
    if(!token){window.location.href='/login.html';return}
    const n=localStorage.getItem('nickname')||localStorage.getItem('username')||'';
    document.getElementById('userNickname').textContent=n;
    document.getElementById('userAvatar').textContent=n.charAt(0).toUpperCase();
    document.getElementById('logoutBtn').style.display='inline';
    loadOverview();
    loadWrong(false);
});
function logout(){localStorage.clear();window.location.href='/login.html'}
function authHeaders(ct){const h={};if(ct)h['Content-Type']=ct;if(token)h['Authorization']='Bearer '+token;return h}
async function loadOverview(){
    try{
        const[sr,wr]=await Promise.all([
            fetch('/api/stats/overview',{headers:authHeaders('application/json')}),
            fetch('/api/wrong-book/stats',{headers:authHeaders('application/json')})
        ]);
        const sd=await sr.json();
        const wd=await wr.json();
        const s=sd.code===0?sd.data:{};
        const w=wd.code===0?wd.data:{};
        document.getElementById('sScore').textContent=s.overallScore!=null?s.overallScore:'-';
        document.getElementById('sReviews').textContent=s.totalReviews||0;
        document.getElementById('sDays').textContent=s.activeDays||0;
        document.getElementById('sStreak').textContent=s.streakDays||0;
        document.getElementById('sCourses').textContent=(s.reviewedCourses||0)+'/'+(s.totalCourses||0);
        document.getElementById('sWrong').textContent=w.unmastered||0;
    } catch(e) { console.error(e); }
}
async function loadWrong(mastered,btnEl){
    document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));
    if(btnEl)btnEl.classList.add('active');
    try{
        let url='/api/wrong-book?';
        if(mastered!==null)url+='mastered='+mastered;
        const r=await fetch(url,{headers:authHeaders('application/json')});
        const d=await r.json();
        const list=d.code===0?d.data:[];
        renderWrongList(list);
    } catch(e) { console.error(e); }
}
function renderWrongList(list){
    const el=document.getElementById('wrongList');
    if(!list.length){el.innerHTML='<div class="empty">暂无错题</div>';return}
    el.innerHTML=list.map(item=>'<div class="wrong-card" id="wb'+item.id+'"><div class="q"><div><strong>'+esc(item.question).substring(0,100)+'</strong></div><div class="ans">你的答案: <span style="color:var(--danger)">'+esc(item.userAnswer||'-')+'</span> | 正确答案: <span style="color:var(--success)">'+esc(item.correctAnswer)+'</span>'+(item.wrongCount>1?' <span style="color:var(--warning);margin-left:10px">×'+item.wrongCount+'</span>':'')+'</div>'+(item.explanation?'<div class="ans">'+esc(item.explanation).substring(0,120)+'</div>':'')+(item.topic?'<div class="ans" style="color:var(--primary)">'+esc(item.topic)+'</div>':'')+'</div><div class="actions">'+(!item.isMastered?'<button class="btn btn-success btn-sm" onclick="markMastered('+item.id+')">已掌握</button>':'')+'<button class="btn btn-danger btn-sm" onclick="deleteWrong('+item.id+')">删除</button></div></div>').join('');
}
async function markMastered(id){
    try{
        await fetch('/api/wrong-book/'+id+'/master',{method:'PUT',headers:authHeaders('application/json')});
        document.getElementById('wb'+id)?.remove();
        loadOverview();
    } catch(e) { console.error(e); }
}
async function deleteWrong(id){
    if(!confirm('删除此错题？'))return;
    try{
        await fetch('/api/wrong-book/'+id,{method:'DELETE',headers:authHeaders('application/json')});
        document.getElementById('wb'+id)?.remove();
        loadOverview();
    } catch(e) { console.error(e); }
}
function esc(s){if(!s)return'';return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
</script>
</body>
</html>
