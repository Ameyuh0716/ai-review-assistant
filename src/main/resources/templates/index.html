<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Review Assistant</title>
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <style>
        body { display: flex; flex-direction: column; min-height: 100vh; background: var(--bg); }
        .main-layout { display: flex; flex: 1; overflow: hidden; height: calc(100vh - 64px); }
        
        /* Sidebar */
        .sidebar {
            width: 280px;
            background: var(--surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }
        .sidebar-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .sidebar-header h6 {
            margin: 0;
            font-weight: 600;
            color: var(--text-secondary);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: .5px;
        }
        .btn-new {
            background: var(--gradient-primary);
            color: #fff;
            border: none;
            border-radius: var(--radius-sm);
            padding: 8px 14px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all var(--t-fast) var(--ease);
            box-shadow: var(--shadow-colored);
        }
        .btn-new:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(124,58,237,.3);
        }
        .conv-list { flex: 1; overflow-y: auto; padding: 8px; }
        .conv-item {
            padding: 12px 14px;
            border-radius: var(--radius-md);
            cursor: pointer;
            margin-bottom: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all var(--t-fast) var(--ease);
        }
        .conv-item:hover { background: var(--bg-subtle); }
        .conv-item.active { background: var(--primary-50); }
        .conv-item .title {
            font-size: 14px;
            color: var(--text);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex: 1;
        }
        .conv-item .time {
            font-size: 11px;
            color: var(--text-muted);
            margin-left: 8px;
            white-space: nowrap;
        }
        .conv-item .del-btn {
            opacity: 0.35;
            color: var(--text-muted);
            font-size: 14px;
            margin-left: 8px;
            border: none;
            background: none;
            cursor: pointer;
            padding: 4px 6px;
            border-radius: var(--radius-sm);
            transition: all var(--t-fast) var(--ease);
        }
        .conv-item:hover .del-btn { opacity: 1; }
        .conv-item .del-btn:hover { color: var(--danger); background: var(--danger-light); }
        .sidebar-empty { text-align: center; color: var(--text-muted); padding: 32px 16px; font-size: 14px; }
        
        /* Chat Area */
        .chat-area { flex: 1; display: flex; flex-direction: column; min-width: 0; }
        .chat-header {
            padding: 14px 24px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .course-badge {
            background: var(--primary-50);
            color: var(--primary);
            border-radius: var(--radius-full);
            padding: 6px 14px;
            font-size: 13px;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .course-badge .close {
            cursor: pointer;
            opacity: .6;
            font-size: 16px;
            line-height: 1;
            transition: opacity var(--t-fast) var(--ease);
        }
        .course-badge .close:hover { opacity: 1; }
        
        .chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .msg {
            max-width: 75%;
            padding: 14px 18px;
            border-radius: var(--radius-lg);
            line-height: 1.7;
            font-size: 14px;
            word-break: break-word;
        }
        .msg.user {
            background: var(--gradient-primary);
            color: #fff;
            margin-left: auto;
            border-bottom-right-radius: var(--radius-sm);
            box-shadow: var(--shadow-colored);
        }
        .msg.ai {
            background: var(--surface);
            color: var(--text);
            border: 1px solid var(--border);
            border-bottom-left-radius: var(--radius-sm);
            box-shadow: var(--shadow-sm);
            line-height: 1.75;
            padding: 18px 22px;
        }
        .msg.ai > *:first-child { margin-top: 0; }
        .msg.ai > *:last-child { margin-bottom: 0; }
        .msg.ai h1, .msg.ai h2, .msg.ai h3, .msg.ai h4, .msg.ai h5, .msg.ai h6 {
            color: var(--text);
            margin-top: 24px;
            margin-bottom: 10px;
            padding-bottom: 6px;
            border-bottom: 1px solid var(--border);
            line-height: 1.4;
        }
        .msg.ai h1 { font-size: 20px; font-weight: 700; }
        .msg.ai h2 { font-size: 18px; font-weight: 700; }
        .msg.ai h3 { font-size: 16px; font-weight: 600; }
        .msg.ai h4 { font-size: 15px; font-weight: 600; }
        .msg.ai h5 { font-size: 14px; font-weight: 600; border-bottom: none; }
        .msg.ai h6 { font-size: 14px; font-weight: 600; color: var(--text-secondary); border-bottom: none; }
        .msg.ai p {
            margin: 8px 0;
            line-height: 1.8;
        }
        .msg.ai ul, .msg.ai ol {
            padding-left: 24px;
            margin: 10px 0;
        }
        .msg.ai li {
            margin: 5px 0;
            line-height: 1.7;
        }
        .msg.ai li > p { margin: 4px 0; }
        .msg.ai blockquote {
            border-left: 3px solid var(--primary, #7c3aed);
            margin: 12px 0;
            padding: 8px 16px;
            background: var(--bg-subtle, #f8f9fa);
            border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
            color: var(--text-secondary);
        }
        .msg.ai pre {
            background: #1a1a2e;
            color: #e0e0e0;
            padding: 16px;
            border-radius: var(--radius-md);
            overflow-x: auto;
            font-size: 13px;
            margin: 14px 0;
            line-height: 1.6;
            border: 1px solid rgba(255,255,255,.06);
        }
        .msg.ai code {
            background: rgba(124,58,237,.08);
            color: #7c3aed;
            padding: 2px 7px;
            border-radius: 4px;
            font-size: 13px;
            font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
        }
        .msg.ai pre code { background: none; color: inherit; padding: 0; font-size: 13px; }
        .msg.ai strong { color: #1a1a2e; font-weight: 600; }
        .msg.ai em { color: #6b7280; }
        .msg.ai hr { border: none; border-top: 1px solid var(--border); margin: 20px 0; }
        .msg.ai table { border-collapse: collapse; width: 100%; margin: 14px 0; font-size: 13px; }
        .msg.ai th, .msg.ai td { border: 1px solid var(--border); padding: 8px 12px; text-align: left; }
        .msg.ai th { background: var(--bg-subtle); font-weight: 600; }
        
        .typing::after { content: '▊'; animation: blink 1s infinite; }
        @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }
        
        .welcome-msg {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-xl);
            padding: 48px 32px;
            text-align: center;
            color: var(--text-secondary);
            font-size: 15px;
            box-shadow: var(--shadow-sm);
        }
        .welcome-msg h5 { 
            color: var(--text); 
            margin-bottom: 8px; 
            font-size: 20px; 
            font-weight: 600;
        }
        .welcome-msg p { color: var(--text-muted); margin: 0 0 24px; font-size: 15px; }
        .quick-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
        .quick-btn {
            font-size: 13px;
            padding: 10px 18px;
            border-radius: var(--radius-full);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            background: var(--surface);
            cursor: pointer;
            transition: all var(--t-fast) var(--ease);
        }
        .quick-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: var(--primary-50);
            transform: translateY(-1px);
        }
        
        /* Input Area */
        .input-area {
            padding: 16px 24px;
            background: var(--surface);
            border-top: 1px solid var(--border);
        }
        .input-row { display: flex; gap: 12px; align-items: flex-end; }
        .input-row textarea {
            flex: 1;
            border: 2px solid var(--border);
            border-radius: var(--radius-md);
            padding: 12px 16px;
            font-size: 14px;
            resize: none;
            min-height: 44px;
            max-height: 120px;
            outline: none;
            font-family: inherit;
            background: var(--bg);
            color: var(--text);
            transition: all var(--t-fast) var(--ease);
        }
        .input-row textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(124,58,237,.1);
        }
        .btn-send {
            background: var(--gradient-primary);
            color: #fff;
            border: none;
            border-radius: var(--radius-md);
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            height: 44px;
            transition: all var(--t-fast) var(--ease);
            box-shadow: var(--shadow-colored);
        }
        .btn-send:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(124,58,237,.35);
        }
        .btn-send:disabled { opacity: .5; cursor: not-allowed; transform: none; }
        .btn-stop {
            background: var(--surface);
            color: var(--danger, #ef4444);
            border: 2px solid var(--danger, #ef4444);
            border-radius: var(--radius-md);
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            height: 44px;
            transition: all var(--t-fast) var(--ease);
        }
        .btn-stop:hover { background: #fef2f2; }
        .btn-stop:disabled { opacity: .5; cursor: not-allowed; }
        .input-hint { text-align: center; font-size: 11px; color: var(--text-muted); margin-top: 8px; }
        
        /* Mobile */
        .sidebar-toggle {
            display: none;
            background: none;
            border: none;
            font-size: 20px;
            color: var(--primary);
            cursor: pointer;
            padding: 4px;
        }
        .overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.4);
            backdrop-filter: blur(4px);
            z-index: 99;
        }
        .overlay.show { display: block; }
        
        @media(max-width: 768px) {
            .sidebar {
                position: fixed;
                left: -300px;
                top: 64px;
                bottom: 0;
                z-index: 100;
                width: 280px;
                box-shadow: var(--shadow-xl);
                transition: left .3s var(--ease);
            }
            .sidebar.open { left: 0; }
            .sidebar-toggle { display: block; }
            .msg { max-width: 90%; }
        }
    </style>
</head>
<body>
<nav class="navbar">
    <div class="navbar-inner">
        <div style="display:flex;align-items:center;gap:12px">
            <button class="sidebar-toggle" onclick="toggleSidebar()">☰</button>
            <a class="navbar-brand" href="/">
                <span class="brand-icon">📚</span>
                AI Review Assistant
            </a>
        </div>
        <div class="nav-links">
            <a class="active" href="/">💬 对话</a>
            <a href="/courses.html">📖 课程</a>
            <a href="/knowledge.html">📚 知识库</a>
            <a href="/quiz.html">📝 测验</a>

<div class="overlay" id="overlay" onclick="toggleSidebar()"></div>
<div class="main-layout">
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h6>对话列表</h6>
            <button class="btn-new" onclick="newChat()">+ 新建</button>
        </div>
        <div class="conv-list" id="convList"></div>
    </div>
    <div class="chat-area">
        <div class="chat-header">
            <span id="chatTitle" style="font-weight:600;color:var(--text);font-size:15px">新对话</span>
            <div id="courseBadgeArea"></div>
        </div>
        <div class="chat-box" id="chatBox">
            <div class="welcome-msg" id="welcomeMsg">
                <h5>有什么可以帮你的？</h5>
                <p>我可以回答问题、生成测验或制定学习计划</p>
                <div class="quick-actions">
                    <button class="quick-btn" onclick="quickAsk('请帮我出3道关于___知识点的选择题')">📝 生成测验</button>
                    <button class="quick-btn" onclick="quickAsk('请帮我制定一个___学科的7天复习计划')">📋 学习计划</button>
                </div>
            </div>
        </div>
        <div class="input-area">
            <div class="input-row">
                <textarea id="userInput" rows="1" placeholder="输入你的问题... (Enter 发送, Shift+Enter 换行)" oninput="autoResize(this)"></textarea>
                <button class="btn-send" id="sendBtn" onclick="sendMessage()">发送</button>
                <button class="btn-stop" id="stopBtn" style="display:none" onclick="stopGeneration()">停止生成</button>
            </div>
            <div class="input-hint">Enter 发送，Shift+Enter 换行</div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
<script>
let token=localStorage.getItem('token');
let currentConversationId=null;
let isStreaming=false;
let abortController=null;
let renderTimer=null;  // 流式渲染防抖定时器

async function refreshAccessToken(){
    const rt=localStorage.getItem('refreshToken');
    if(!rt)return false;
    try{
        const r=await fetch('/api/auth/refresh?refreshToken='+encodeURIComponent(rt));
        const d=await r.json();
        if(d.code===0){
            token=d.data.token;
            localStorage.setItem('token',token);
            localStorage.setItem('refreshToken',d.data.refreshToken);
            localStorage.setItem('tokenExpiry',Date.now()+d.data.expiresIn);
            return true;
        }
    } catch(e) {}
    localStorage.removeItem('token');
    localStorage.removeItem('refreshToken');
    localStorage.removeItem('tokenExpiry');
    token=null;
    return false;
}

async function ensureTokenValid(){
    const exp=parseInt(localStorage.getItem('tokenExpiry')||'0');
    if(!token||Date.now()>exp-120000)return await refreshAccessToken();
    return true;
}

const _origFetch=window.fetch;
window.fetch=async function(...a){
    let r=await _origFetch.apply(this,a);
    if(r.status===401&&token){
        if(await refreshAccessToken()){
            const[u,o]=a;
            if(o&&o.headers)o.headers={...o.headers,'Authorization':'Bearer '+token};
            r=await _origFetch(u,o);
        } else {
            window.location.href='/login.html';
        }
    }
    return r;
};

document.addEventListener('DOMContentLoaded',async()=>{
    const valid=await ensureTokenValid();
    if(!valid){
        window.location.href='/login.html';
        return;
    }
    checkAuth();
    loadCourseBadge();
    // 页面加载时：如果侧边栏已有对话，默认显示最新对话，而不是新建空会话
    await initOrRestoreChat();
    document.getElementById('userInput').addEventListener('keydown',e=>{
        if(e.key==='Enter'&&!e.shiftKey){
            e.preventDefault();
            sendMessage();
        }
    });
    if(window.marked)marked.setOptions({breaks:true,gfm:true});
});

// 初始化：优先恢复上一次查看的对话；没有则指向最新已有对话；都没有再新建空对话
async function initOrRestoreChat(){
    await ensureTokenValid();
    try{
        const savedId=localStorage.getItem('currentConversationId');
        const listR=await fetch('/api/conversations',{headers:authHeaders('application/json')});
        const listD=await listR.json();
        const list=Array.isArray(listD)?listD:(listD.data||[]);

        // 如果本地保存的会话仍存在，直接恢复
        if(savedId && list.some(c=>String(c.id)===String(savedId))){
            const conv=list.find(c=>String(c.id)===String(savedId));
            await switchConv(conv.id, conv.title);
            return;
        }

        // 否则指向最新已有对话；若最新为空「新对话」则复用
        if(list.length>0){
            const latest=list[0];
            if(latest.title==='新对话'){
                await switchConv(latest.id,'新对话');
                return;
            }
            await switchConv(latest.id, latest.title);
            return;
        }

        // 没有任何会话时才新建
        await createNewConversation();
    }catch(e){
        console.error('初始化会话失败:',e);
        showWelcome();
    }
}

async function createNewConversation(){
    const r=await fetch('/api/conversations',{
        method:'POST',
        headers:authHeaders('application/json'),
        body:JSON.stringify({title:'新对话'})
    });
    const conv=await r.json();
    currentConversationId=conv.id||null;
    showWelcome();
    document.getElementById('chatTitle').textContent='新对话';
    loadConversations();
}

function checkAuth(){
    if(!token){
        document.getElementById('userNickname').textContent='访客';
        return;
    }
    const n=localStorage.getItem('nickname')||localStorage.getItem('username')||'?';
    document.getElementById('userNickname').textContent=n;
    document.getElementById('userAvatar').textContent=n.charAt(0).toUpperCase();
    document.getElementById('logoutBtn').style.display='inline';
}

function logout(){
    localStorage.clear();
    window.location.href='/login.html';
}

function authHeaders(ct){
    const h={};
    if(ct)h['Content-Type']=ct;
    if(token)h['Authorization']='Bearer '+token;
    return h;
}

async function loadConversations(){
    await ensureTokenValid();
    try{
        const r=await fetch('/api/conversations',{headers:authHeaders('application/json')});
        const d=await r.json();
        const list=Array.isArray(d)?d:(d.data||[]);
        renderConvList(list);
    } catch(e) { console.error(e); }
}

function renderConvList(convs){
    const el=document.getElementById('convList');
    if(!convs.length){
        el.innerHTML='<div class="sidebar-empty">暂无对话</div>';
        return;
    }
    el.innerHTML=convs.map(c=>'<div class="conv-item '+(c.id===currentConversationId?'active':'')+'" data-id="'+c.id+'" onclick="switchConv('+c.id+',\''+esc(c.title)+'\')"><span class="title">'+esc(c.title||'新对话')+'</span><span class="time">'+fmtTime(c.updatedAt)+'</span><button class="del-btn" onclick="event.stopPropagation();deleteConv('+c.id+')" title="删除">×</button></div>').join('');
}

async function switchConv(id,title){
    currentConversationId=id;
    localStorage.setItem('currentConversationId', id);
    document.getElementById('chatTitle').textContent=title||'对话';
    try{
        const r=await fetch('/api/messages?conversationId='+id,{headers:authHeaders('application/json')});
        const d=await r.json();
        const msgs=Array.isArray(d)?d:(d.data||[]);
        const box=document.getElementById('chatBox');
        box.innerHTML='';
        if(msgs.length===0){
            // 空会话：显示欢迎页
            let w=createWelcomeEl();
            box.appendChild(w);
        } else {
            msgs.forEach(m=>{
                // 出题意图的历史消息在聊天区应隐藏答案与解析
                const content=(m.intent==='QUIZ'||m.intent==='quiz')?hideQuizAnswers(m.content):m.content;
                appendMsg(content,m.role==='user'?'user':'ai',false);
            });
        }
    } catch(e) { console.error(e); }
    loadConversations();
    closeSidebar();
}

async function deleteConv(id){
    if(!confirm('删除此对话？'))return;
    // 1. 乐观删除：通过 data-id 精确定位并移除
    const item=document.querySelector('.conv-item[data-id="'+id+'"]');
    if(item){
        item.style.transition='opacity .2s,transform .2s';
        item.style.opacity='0';
        item.style.transform='translateX(20px)';
        setTimeout(()=>item.remove(),200);
    }
    // 2. 如果删除的是当前正在查看的对话，切到欢迎页
    if(currentConversationId===id){
        currentConversationId=null;
        showWelcome();
    }
    // 3. 发送删除请求
    try{
        const resp=await fetch('/api/conversations/'+id,{method:'DELETE',headers:authHeaders('application/json')});
        if(!resp.ok){
            await loadConversations();
        }
    } catch(e) {
        console.error(e);
        await loadConversations();
    }
}

function showWelcome(){
    const box=document.getElementById('chatBox');
    let w=document.getElementById('welcomeMsg');
    // 清空聊天区域中的所有消息
    const msgs=box.querySelectorAll('.msg');
    msgs.forEach(m=>m.remove());
    // 如果 welcome 元素不在 DOM 中（已被其他操作移除），重新创建
    if(!w||!w.parentNode){
        w=createWelcomeEl();
    }
    w.style.display='block';
    if(!box.contains(w))box.appendChild(w);
    document.getElementById('chatTitle').textContent='新对话';
}

function createWelcomeEl(){
    const div=document.createElement('div');
    div.className='welcome-msg';
    div.id='welcomeMsg';
    div.innerHTML='<h5>有什么可以帮你的？</h5>'
        +'<p>我可以回答问题、生成测验或制定学习计划</p>'
        +'<div class="quick-actions">'
        +'<button class="quick-btn" onclick="quickAsk(\'请帮我出3道关于___知识点的选择题\')">📝 生成测验</button>'
        +'<button class="quick-btn" onclick="quickAsk(\'请帮我制定一个___学科的7天复习计划\')">📋 学习计划</button>'
        +'</div>';
    return div;
}

function newChat(){
    if(currentConversationId===null){
        showToast('当前已经是最新对话');
        return;
    }
    initNewChat();
    closeSidebar();
}

// 创建新会话并在侧边栏显示（如果最新会话已经是空的「新对话」则复用）
async function initNewChat(){
    await ensureTokenValid();
    try{
        // 先检查最新会话是否为空的「新对话」
        const listR=await fetch('/api/conversations',{headers:authHeaders('application/json')});
        const listD=await listR.json();
        const list=Array.isArray(listD)?listD:(listD.data||[]);
        if(list.length>0&&list[0].title==='新对话'){
            // 最新会话就是空会话，直接指向它
            await switchConv(list[0].id,'新对话');
            return;
        }
        // 否则创建新会话
        await createNewConversation();
    }catch(e){
        console.error('创建会话失败:',e);
        currentConversationId=null;
        showWelcome();
    }
}

function showToast(msg){
    let t=document.getElementById('toast');
    if(!t){
        t=document.createElement('div');
        t.id='toast';
        t.style.cssText='position:fixed;top:80px;left:50%;transform:translateX(-50%);background:var(--surface);color:var(--text);padding:10px 24px;border-radius:var(--radius-md);box-shadow:var(--shadow-lg);font-size:14px;z-index:9999;opacity:0;transition:opacity .3s;pointer-events:none;border:1px solid var(--border)';
        document.body.appendChild(t);
    }
    t.textContent=msg;
    t.style.opacity='1';
    clearTimeout(t._timer);
    t._timer=setTimeout(()=>{t.style.opacity='0';},2000);
}

    document.getElementById('overlay').classList.toggle('show');
}

function closeSidebar(){

function showStopBtn(show){
    const sendBtn=document.getElementById('sendBtn');
    const stopBtn=document.getElementById('stopBtn');
    if(show){
        sendBtn.style.display='none';
        stopBtn.style.display='inline-flex';

function stopGeneration(){
    if(abortController){
        abortController.abort();
        abortController=null;
    }
}

// 流式渲染防抖：积累文本后统一渲染，避免 partial markdown 解析失败
function scheduleRender(aiEl){
    if(renderTimer)clearTimeout(renderTimer);
    renderTimer=setTimeout(()=>{
        if(aiEl&&aiEl.dataset.rawText){
            // 流式过程中使用轻量 Markdown 渲染：保留换行、标题、粗体、列表等基本格式，
            // 同时避免 partial markdown（如未闭合代码块、表格）导致整段错乱。
            aiEl.innerHTML=renderStreamingMd(aiEl.dataset.rawText);
            const box=document.getElementById('chatBox');
            box.scrollTop=box.scrollHeight;
        }
    },80);
}

// 流式过程中的轻量 Markdown 渲染：安全、可增量、不会破坏未闭合结构
function renderStreamingMd(text){
    if(!text)return'';
    let t=text.replace(/\r\n/g,'\n').replace(/\r/g,'\n');
    // 转义 HTML 特殊字符
    t=t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    // 标题 # ~ ######
    t=t.replace(/^######\s+(.+)$/gm,'<h6>$1</h6>');
    t=t.replace(/^#####\s+(.+)$/gm,'<h5>$1</h5>');
    t=t.replace(/^####\s+(.+)$/gm,'<h4>$1</h4>');
    t=t.replace(/^###\s+(.+)$/gm,'<h3>$1</h3>');
    t=t.replace(/^##\s+(.+)$/gm,'<h2>$1</h2>');
    t=t.replace(/^#\s+(.+)$/gm,'<h1>$1</h1>');
    // 粗体、斜体、行内代码
    t=t.replace(/\*\*\*(.+?)\*\*/g,'<strong><em>$1</em></strong>');
    t=t.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
    t=t.replace(/\*(.+?)\*/g,'<em>$1</em>');
    t=t.replace(/`([^`]+)`/g,'<code>$1</code>');
    // 无序列表（要求行首 - 后有空格）
    t=t.replace(/(?:^|\n)-\s+(.+)$/g,'<li>$1</li>');
    // 段落：保留换行，双换行分段
    t=t.replace(/\n{2,}/g,'</p><p>');
    t=t.replace(/\n/g,'<br>');
    if(!t.startsWith('<'))t='<p>'+t;
    if(!t.endsWith('>'))t+='</p>';
    // 把孤立的 <li> 包成 <ul>
    t=t.replace(/(<li>.*?<\/li>)/s,'<ul>$1</ul>');
    return t;
}

// 隐藏测验文本中的答案与解析，用于从数据库加载历史消息时保持聊天区不泄露答案
function hideQuizAnswers(text){
    if(!text)return text;
    // 移除 **答案：X** 或 答案：X 行
    let t=text.replace(/\*\*答案[：:]\s*[A-Da-d]\*\*/g,'');
    t=t.replace(/(?:^|\n)\s*答案[：:]\s*[A-Da-d]\s*/g,'\n');
    // 移除 **解析：** 及其后续列表内容（直到下一个题目标记或分隔线）
    t=t.replace(/\*\*解析[：:]\*\*\s*[\s\S]*?(?=(?:\n#{1,3}\s*题目\s*\d+[：:])|(?:\n---\s*$)|(?:\n---\s*\n#{1,3}\s*题目)|$)/g,'');
    t=t.replace(/(?:^|\n)解析[：:]\s*[\s\S]*?(?=(?:\n#{1,3}\s*题目\s*\d+[：:])|(?:\n---\s*$)|(?:\n---\s*\n#{1,3}\s*题目)|$)/g,'\n');
    // 清理多余空行
    t=t.replace(/\n{3,}/g,'\n\n').trim();
    return t;
}

// 把一次 SSE 事件的内容按短句/片段逐步追加到 dom，模拟逐字打字效果
let chunkTimer=null;
function streamChunkToScreen(aiEl, chunk){
    if(!chunk)return;
    if(chunkTimer){clearTimeout(chunkTimer);chunkTimer=null;}
    // 按换行、中文标点、空格等边界拆成细小片段
    const tokens=chunk.split(/(\n+|，|。|！|？|；|\.|\!|\?|;|\s+)/).filter(Boolean);
    let i=0;
    let displayed=aiEl.dataset.rawText || '';
    // 初始显示当前完整文本（不含新 chunk）
    aiEl.innerHTML=renderStreamingMd(displayed.slice(0, -chunk.length) || displayed);
    const base=displayed.slice(0, -chunk.length);
    // 动态延迟：内容越长单字延迟越短，总动画时间控制在约 2 秒内，避免大段文字等待过久
    const maxDuration=2000;
    const stepDelay=Math.max(8, Math.min(30, Math.floor(maxDuration/Math.max(1,tokens.length))));
    function showNext(){
        if(i>=tokens.length)return;
        const piece=tokens.slice(0, ++i).join('');
        aiEl.dataset.rawText=base+piece;
        aiEl.innerHTML=renderStreamingMd(base+piece);
        const box=document.getElementById('chatBox');
        box.scrollTop=box.scrollHeight;
        chunkTimer=setTimeout(showNext, stepDelay);
    }
    showNext();
}

async function sendMessage(){
    const input=document.getElementById('userInput');
    const msg=input.value.trim();
    if(!msg||isStreaming)return;
    document.getElementById('welcomeMsg').style.display='none';
    appendMsg(msg,'user');
    input.value='';
    autoResize(input);
    const cn=localStorage.getItem('currentCourseName');
    let fullMsg=msg;
    if(cn&&!msg.includes(cn))fullMsg='[课程: '+cn+'] '+msg;
    let url='/api/agent/stream?message='+encodeURIComponent(fullMsg);
    if(currentConversationId)url+='&conversationId='+currentConversationId;
    const aiId=appendMsg('','ai',true);
    const aiEl=document.getElementById(aiId);
    isStreaming=true;
    showStopBtn(true);
    abortController=new AbortController();
    let metaParsed=false;  // 标记元数据是否已解析
    try{
        const resp=await fetch(url,{headers:authHeaders(),signal:abortController.signal});
        const reader=resp.body.getReader();
        const decoder=new TextDecoder();
        let buffer='';
        let eventDataLines=[];  // 同一 SSE 事件的多行 data: 内容
        const flushEvent=()=>{
            if(eventDataLines.length===0)return;
            // SSE 事件中多行 data: 用换行符连接，空 data: 行贡献真实换行
            const chunk=eventDataLines.join('\n');
            eventDataLines=[];
            if(!chunk)return;
            // 解析第一个事件：会话元数据
            if(!metaParsed){
                metaParsed=true;
                try{
                    const meta=JSON.parse(chunk);
                    if(meta.conversationId){
                        currentConversationId=meta.conversationId;
                        loadConversations();  // 刷新侧边栏以高亮当前会话
                        return;  // 元数据不显示到聊天区
                    }
                }catch(e){ /* 不是 JSON 元数据，当作普通内容处理 */ }
            }
            aiEl.dataset.rawText=(aiEl.dataset.rawText||'')+chunk;
            aiEl.classList.add('typing');
            // 整个 SSE 事件立即追加显示，不再等到流结束；
            // 对单次大事件再按字符/短句分片，让文本逐字出现。
            streamChunkToScreen(aiEl, chunk);
        };
        while(true){
            const{done,value}=await reader.read();
            if(done)break;
            buffer+=decoder.decode(value,{stream:true});
            const lines=buffer.split('\n');
            buffer=lines.pop();
            for(const line of lines){
                if(line.startsWith('data:')){
                    // 仅去掉 data: 后的一个前导空格，保留内容中的换行
                    eventDataLines.push(line.substring(5).replace(/^\s/,''));
                } else if(line.trim()===''){
                    // 空行表示一个 SSE 事件结束
                    flushEvent();
                }
            }
        }
        // 处理最后未以空行结尾的剩余内容
        if(buffer.trim().startsWith('data:')){
            eventDataLines.push(buffer.trim().substring(5).replace(/^\s/,''));
        }
        flushEvent();
        // 流结束后最终渲染一次完整内容
        if(renderTimer)clearTimeout(renderTimer);
        if(chunkTimer){clearTimeout(chunkTimer);chunkTimer=null;}
        aiEl.innerHTML=renderMd(aiEl.dataset.rawText||'');
        aiEl.classList.remove('typing');
        postProcessAiMessage(aiEl);
    } catch(e) {
        if(renderTimer)clearTimeout(renderTimer);
        if(chunkTimer){clearTimeout(chunkTimer);chunkTimer=null;}
        if(e.name==='AbortError'){
            aiEl.classList.remove('typing');
            if(!aiEl.dataset.rawText)aiEl.innerHTML=renderMd('（已停止生成）');
            else aiEl.innerHTML=renderMd(aiEl.dataset.rawText);
        } else {
            aiEl.innerHTML=renderMd(aiEl.dataset.rawText||'请求失败: '+e.message);
            aiEl.classList.remove('typing');
        }
    } finally {
        isStreaming=false;
        abortController=null;
        showStopBtn(false);
        loadConversations();
    }
}

// 根据 AI 回复内容追加后续操作按钮或提示
function postProcessAiMessage(aiEl){
    const text=aiEl.dataset.rawText||'';
    if(!text || text.length < 80)return;
    const actions=document.createElement('div');
    actions.style.cssText='margin-top:12px;display:flex;gap:10px;flex-wrap:wrap;';
    let hasAction=false;
    // 检测测验内容：必须包含题目标题和多个选项行
    if(/#{1,3}\s*题目\s*\d+[：:]/.test(text) && /[A-D][.．、]\s*\S/.test(text)){
        const btn=document.createElement('button');
        btn.className='btn btn-primary btn-sm';
        btn.textContent='📝 去测验页面作答';
        btn.onclick=async ()=>{
            // 聊天区展示的是无答案版本；跳转到测验页面前从数据库取完整版（含答案解析）
            let fullText=text;
            if(currentConversationId){
                try{
                    const r=await fetch('/api/messages?conversationId='+currentConversationId,{headers:authHeaders('application/json')});
                    const d=await r.json();
                    const msgs=Array.isArray(d)?d:(d.data||[]);
                    for(let i=msgs.length-1;i>=0;i--){
                        if(msgs[i].role==='assistant'){
                            fullText=msgs[i].content;
                            break;
                        }
                    }
                }catch(e){ console.error('获取完整测验内容失败:',e); }
            }
            localStorage.setItem('currentQuizMarkdown',fullText);
            localStorage.setItem('currentQuizTopic',extractQuizTopic(fullText));
            window.location.href='/quiz.html';
        };
        actions.appendChild(btn);
        hasAction=true;
    }
    // 检测学习计划内容：必须包含多天安排或总体安排+每日计划
    const hasDailyPlan=/第\s*\d+\s*天[：:]/.test(text) && text.match(/第\s*\d+\s*天[：:]/g).length >= 2;
    const hasPlanStructure=/总体安排/.test(text) && /每日计划|第\s*1\s*天[：:]/.test(text);
    if(hasDailyPlan || hasPlanStructure){
        const tip=document.createElement('span');
        tip.style.cssText='font-size:13px;color:var(--success);display:flex;align-items:center;gap:4px;';
        tip.innerHTML='✅ 已自动保存到 <a href="/plan.html" style="color:var(--success);text-decoration:underline">学习计划</a>';
        actions.appendChild(tip);
        hasAction=true;
    }
    if(hasAction) aiEl.appendChild(actions);
}

// 从测验文本中提取最可能的主题作为标题
function extractQuizTopic(text){
    const m=text.match(/关于(.+?)的/);
    if(m)return m[1].trim();
    const m2=text.match(/###\s*题目\s*\d+[：:]\s*(.+?)(?:\n|$)/);
    if(m2){
        const t=m2[1].trim();
        if(t.length<=20)return t;
    }
    return '';
}

function quickAsk(text){
    const input=document.getElementById('userInput');
    input.value=text;
    input.focus();
    autoResize(input);
}
function quickSend(text){
    const input=document.getElementById('userInput');
    const cn=localStorage.getItem('currentCourseName');
    input.value=cn?text+'（课程：'+cn+'）':text;
    input.focus();
    autoResize(input);
    sendMessage();
}

let msgCounter=0;
function appendMsg(text,type,streaming){
    const id='m-'+(++msgCounter);
    const box=document.getElementById('chatBox');
    const div=document.createElement('div');
    div.id=id;
    div.className='msg '+type;
    if(streaming){
        div.dataset.rawText='';
        div.innerHTML='<span class="typing"></span>';
    } else {
        div.innerHTML=type==='user'?esc(text):renderMd(text);
    }
    box.appendChild(div);
    box.scrollTop=box.scrollHeight;
    const w=document.getElementById('welcomeMsg');
    if(w)w.style.display='none';
    return id;
}

function renderMd(text){
    if(!text)return'';
    // 统一换行符
    let t=text.replace(/\r\n/g,'\n').replace(/\r/g,'\n');
    if(window.marked){
        try{
            const raw=marked.parse(t,{
                breaks:true,
                gfm:true,
                headerIds:false,
                mangle:false
            });
            if(window.DOMPurify)return DOMPurify.sanitize(raw,{ADD_ATTR:['target']});
            return raw;
        } catch(e) {}
    }
    // Fallback: 手动解析 Markdown（支持 # ~ ######）
    t=t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    // 代码块
    t=t.replace(/```(\w*)\n([\s\S]*?)```/g,'<pre><code>$2</code></pre>');
    // 标题 # ~ ######
    t=t.replace(/^######\s+(.+)$/gm,'<h6>$1</h6>');
    t=t.replace(/^#####\s+(.+)$/gm,'<h5>$1</h5>');
    t=t.replace(/^####\s+(.+)$/gm,'<h4>$1</h4>');
    t=t.replace(/^###\s+(.+)$/gm,'<h3>$1</h3>');
    t=t.replace(/^##\s+(.+)$/gm,'<h2>$1</h2>');
    t=t.replace(/^#\s+(.+)$/gm,'<h1>$1</h1>');
    // 粗体、斜体、行内代码
    t=t.replace(/\*\*\*(.+?)\*\*/g,'<strong><em>$1</em></strong>');
    t=t.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
    t=t.replace(/\*(.+?)\*/g,'<em>$1</em>');
    t=t.replace(/`([^`]+)`/g,'<code>$1</code>');
    // 引用
    t=t.replace(/^>\s+(.+)$/gm,'<blockquote>$1</blockquote>');
    // 水平线
    t=t.replace(/^---+$/gm,'<hr>');
    // 无序列表
    t=t.replace(/^-\s+(.+)$/gm,'<li>$1</li>');
    t=t.replace(/(<li>.*<\/li>)/s,'<ul>$1</ul>');
    // 段落：连续换行变 <br>
    t=t.replace(/\n{2,}/g,'</p><p>');
    t=t.replace(/\n/g,'<br>');
    if(!t.startsWith('<'))t='<p>'+t;
    if(!t.endsWith('>'))t+='</p>';
    return t;
}

function esc(s){
    if(!s)return'';
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function fmtTime(d){
    if(!d)return'';
    const t=new Date(d);
    return String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0')+' '+String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0');
}

function autoResize(el){
    el.style.height='auto';
    el.style.height=Math.min(el.scrollHeight,120)+'px';
}
