<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>知识库 - AI Review Assistant</title>
    <link rel="stylesheet" href="/css/common.css">
    <style>
        .stats-bar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 24px; }
        .stat-box {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 20px 24px;
            text-align: center;
        }
        .stat-box .num { font-size: 32px; font-weight: 700; color: var(--primary); }
        .stat-box .label { font-size: 13px; color: var(--text-muted); margin-top: 4px; }
        .upload-zone {
            border: 2px dashed var(--border);
            border-radius: var(--radius-lg);
            padding: 40px;
            text-align: center;
            color: var(--text-muted);
            cursor: pointer;
            transition: all var(--t-normal) var(--ease);
        }
        .upload-zone:hover { border-color: var(--primary); background: var(--primary-50); }
        .upload-zone.dragover { border-color: var(--primary); background: var(--primary-50); }
        .upload-zone svg { width: 40px; height: 40px; stroke: var(--text-muted); margin-bottom: 12px; }
        .upload-zone p { font-size: 14px; margin: 0; }
        .upload-zone .hint { font-size: 12px; color: var(--text-muted); margin-top: 6px; }
        .chunk-card {
            background: var(--bg-subtle);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-md);
            padding: 14px 18px;
            margin-bottom: 10px;
            font-size: 14px;
            line-height: 1.7;
        }
        .chunk-card .meta { color: var(--text-muted); font-size: 12px; margin-top: 8px; }
        .file-row { display: flex; gap: 12px; align-items: center; margin-bottom: 16px; }
        .empty { text-align: center; padding: 48px; color: var(--text-muted); font-size: 14px; }
    </style>
</head>
<body>
<nav class="navbar">
    <div class="navbar-inner">
        <a class="navbar-brand" href="/"><span class="brand-icon">📚</span>AI Review Assistant</a>
        <div class="nav-links">
            <a href="/">💬 对话</a>
            <a href="/courses.html">📖 课程</a>
            <a class="active" href="/knowledge.html">📚 知识库</a>
            <a href="/quiz.html">📝 测验</a>
            <a href="/plan.html">📅 计划</a>
            <a href="/stats.html">📊 统计</a>
            <div class="nav-user">
                <span class="nav-avatar" id="userAvatar">G</span>
                <span class="nav-nickname" id="userNickname">访客</span>
            </div>
            <button class="nav-logout" onclick="logout()" id="logoutBtn" style="display:none">退出</button>
        </div>
    </div>
</nav>
<div class="page-body">
    <div class="stats-bar">
        <div class="stat-box"><div class="num" id="statCourses">0</div><div class="label">课程数</div></div>
        <div class="stat-box"><div class="num" id="statChunks">0</div><div class="label">知识片段</div></div>
        <div class="stat-box"><div class="num" id="statSelected">-</div><div class="label">当前课程</div></div>
    </div>
    <div class="card">
        <div class="card-header">
            <div class="card-title"><span class="title-icon">📤</span>上传文档</div>
        </div>
        <div class="file-row">
            <select class="form-select" id="courseSelect" style="max-width:260px">
                <option value="">选择课程...</option>
            </select>
            <input type="file" id="fileInput" accept=".txt,.md,.pdf,.doc,.docx" style="display:none">
            <button class="btn btn-primary btn-sm" onclick="document.getElementById('fileInput').click()">选择文件</button>
            <span id="fileName" style="color:var(--text-muted);font-size:14px"></span>
        </div>
        <div class="upload-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                <polyline points="17 8 12 3 7 8"/>
                <line x1="12" y1="3" x2="12" y2="15"/>
            </svg>
            <p>拖放文件到此处，或点击选择</p>
            <div class="hint">支持 txt / md / pdf / doc / docx</div>
        </div>
        <div id="uploadProgress" style="display:none;margin-top:16px">
            <div class="progress"><div class="progress-bar" id="uploadBar" style="width:0%"></div></div>
            <div id="uploadStatus" style="font-size:13px;color:var(--text-muted);margin-top:8px"></div>
        </div>
    </div>
    <div class="card">
        <div class="card-header">
            <div class="card-title">
                <span class="title-icon">📄</span>
                知识片段
                <span id="chunkCount" style="font-weight:400;font-size:13px;color:var(--text-muted);margin-left:8px"></span>
            </div>
        </div>
        <div id="chunkList"><div class="empty">选择课程查看知识片段</div></div>
    </div>
</div>
<script>
const token=localStorage.getItem('token');
let courses=[];
let selectedCourseId=null;
document.addEventListener('DOMContentLoaded',()=>{
    if(!token){window.location.href='/login.html';return}
    const n=localStorage.getItem('nickname')||localStorage.getItem('username')||'';
    document.getElementById('userNickname').textContent=n;
    document.getElementById('userAvatar').textContent=n.charAt(0).toUpperCase();
    document.getElementById('logoutBtn').style.display='inline';
    loadCourses();
    initDragDrop();
    document.getElementById('fileInput').addEventListener('change',handleFileSelect);
});
function logout(){localStorage.clear();window.location.href='/login.html'}
function authHeaders(ct){const h={};if(ct)h['Content-Type']=ct;if(token)h['Authorization']='Bearer '+token;return h}
async function loadCourses(){
    try{
        const r=await fetch('/courses',{headers:authHeaders('application/json')});
        const d=await r.json();
        courses=d.code===0?d.data:[];
        document.getElementById('statCourses').textContent=courses.length;
        const s=document.getElementById('courseSelect');
        s.innerHTML='<option value="">选择课程...</option>'+courses.map(c=>'<option value="'+c.id+'">'+esc(c.name)+'</option>').join('');
        const saved=localStorage.getItem('kbCourseId');
        if(saved&&courses.find(c=>c.id==saved)){s.value=saved;selectCourse(saved)}
    } catch(e) { console.error(e); }
}
document.getElementById('courseSelect').addEventListener('change',e=>selectCourse(e.target.value));
async function selectCourse(id){
    if(!id){
        selectedCourseId=null;
        document.getElementById('chunkList').innerHTML='<div class="empty">选择课程</div>';
        document.getElementById('statChunks').textContent='0';
        document.getElementById('statSelected').textContent='-';
        return;
    }
    selectedCourseId=parseInt(id);
    localStorage.setItem('kbCourseId',id);
    const c=courses.find(x=>x.id===selectedCourseId);
    document.getElementById('statSelected').textContent=c?c.name.substring(0,8):'-';
    loadChunks();
}
async function loadChunks(page){
    page=page||1;
    if(!selectedCourseId)return;
    try{
        const[dr,cr]=await Promise.all([
            fetch('/api/knowledge-base/'+selectedCourseId+'/chunks?page='+page+'&pageSize=20',{headers:authHeaders('application/json')}),
            fetch('/api/knowledge-base/'+selectedCourseId+'/count',{headers:authHeaders('application/json')})
        ]);
        const d=await dr.json();
        const cd=await cr.json();
        const chunks=d.items||[];
        const total=d.total||cd.count||0;
        const tp=d.totalPages||1;
        document.getElementById('statChunks').textContent=total;
        document.getElementById('chunkCount').textContent='共 '+total+' 条';
        renderChunks(chunks,tp,page);
    } catch(e) { console.error(e); }
}
function renderChunks(chunks,tp,page){
    const el=document.getElementById('chunkList');
    if(!chunks.length){el.innerHTML='<div class="empty">暂无知识片段，上传文档开始</div>';return}
    let h='';
    chunks.forEach((c,i)=>{
        h+='<div class="chunk-card"><div><strong>#'+((page-1)*20+i+1)+'</strong>&nbsp;&nbsp;'+esc(c.content).substring(0,200)+(c.content.length>200?'...':'')+'</div><div class="meta">片段 '+(c.chunkIndex!=null?c.chunkIndex+1:i+1)+' / '+(c.chunkTotal||'?')+'</div></div>';
    });
    if(tp>1){
        h+='<div style="text-align:center;margin-top:20px;display:flex;gap:10px;justify-content:center">';
        if(page>1)h+='<button class="btn btn-secondary btn-sm" onclick="loadChunks('+(page-1)+')">上一页</button>';
        h+='<span style="line-height:36px;font-size:14px;color:var(--text-muted)">'+page+' / '+tp+'</span>';
        if(page<tp)h+='<button class="btn btn-secondary btn-sm" onclick="loadChunks('+(page+1)+')">下一页</button>';
        h+='</div>';
    }
    el.innerHTML=h;
}
function handleFileSelect(e){const f=e.target.files[0];if(!f)return;document.getElementById('fileName').textContent=f.name;uploadFile(f)}
function initDragDrop(){
    const z=document.getElementById('dropZone');
    z.addEventListener('dragover',e=>{e.preventDefault();z.classList.add('dragover')});
    z.addEventListener('dragleave',()=>z.classList.remove('dragover'));
    z.addEventListener('drop',e=>{e.preventDefault();z.classList.remove('dragover');if(e.dataTransfer.files[0])uploadFile(e.dataTransfer.files[0])});
}
async function uploadFile(file){
    if(!selectedCourseId){alert('请先选择课程');return}
    const p=document.getElementById('uploadProgress');
    const b=document.getElementById('uploadBar');
    const s=document.getElementById('uploadStatus');
    p.style.display='block';
    b.style.width='30%';
    s.textContent='上传并处理中...';
    const fd=new FormData();
    fd.append('courseId',selectedCourseId);
    fd.append('file',file);
    try{
        b.style.width='70%';
        const r=await fetch('/api/document/upload',{method:'POST',headers:{'Authorization':'Bearer '+token},body:fd});
        const t=await r.text();
        b.style.width='100%';
        s.textContent=t;
        setTimeout(()=>{p.style.display='none';b.style.width='0%'},3000);
        loadChunks();
    } catch(e) {
        b.style.width='100%';
        b.style.background='var(--danger)';
        s.textContent='上传失败: '+e.message;
    }
    document.getElementById('fileInput').value='';
    document.getElementById('fileName').textContent='';
}
function esc(s){if(!s)return'';return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
</script>
</body>
</html>
