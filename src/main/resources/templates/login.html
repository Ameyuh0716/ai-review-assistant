<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - AI Review Assistant</title>
    <link rel="stylesheet" href="/css/common.css">
    <style>
        body { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh;
            background: linear-gradient(135deg, #FAF5FF 0%, #F3E8FF 50%, #E9D5FF 100%);
        }
        .auth-wrapper { width: 100%; max-width: 420px; padding: 20px; }
        .auth-card { 
            background: var(--surface); 
            border: 1px solid var(--border); 
            border-radius: var(--radius-xl); 
            padding: 40px 32px; 
            box-shadow: var(--shadow-lg);
        }
        .auth-header { text-align: center; margin-bottom: 32px; }
        .auth-header .brand-icon {
            width: 56px; height: 56px;
            border-radius: var(--radius-lg);
            background: var(--gradient-primary);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            box-shadow: var(--shadow-colored);
        }
        .auth-header .brand-icon svg { width: 28px; height: 28px; stroke: #fff; }
        .auth-header h1 { font-size: 22px; font-weight: 700; color: var(--text); margin-bottom: 8px; }
        .auth-header p { font-size: 14px; color: var(--text-muted); }
        .auth-tabs { 
            display: flex; 
            gap: 0; 
            margin-bottom: 28px; 
            background: var(--bg-subtle);
            padding: 4px;
            border-radius: var(--radius-md);
        }
        .auth-tab {
            flex: 1;
            padding: 12px 0;
            text-align: center;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-muted);
            background: none;
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all var(--t-fast) var(--ease);
        }
        .auth-tab:hover { color: var(--text); }
        .auth-tab.active { 
            background: var(--surface); 
            color: var(--primary);
            box-shadow: var(--shadow-sm);
        }
        .auth-form { display: none; }
        .auth-form.active { display: block; }
        .auth-submit {
            width: 100%;
            padding: 14px;
            margin-top: 12px;
            font-size: 15px;
            font-weight: 600;
            color: #fff;
            background: var(--gradient-primary);
            border: none;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all var(--t-fast) var(--ease);
            box-shadow: var(--shadow-colored);
        }
        .auth-submit:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(124,58,237,.35);
        }
        .auth-submit:disabled { opacity: .5; cursor: not-allowed; transform: none; }
        .auth-alert {
            padding: 12px 16px;
            border-radius: var(--radius-md);
            font-size: 14px;
            margin-bottom: 16px;
            display: none;
        }
        .auth-alert.show { display: block; }
        .auth-alert.error { background: var(--danger-light); color: #be123c; }
    </style>
</head>
<body>
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <div class="brand-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
                    <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
                </svg>
            </div>
            <h1>AI Review Assistant</h1>
            <p>智能学习，高效复习</p>
        </div>
        <div class="auth-tabs">
            <button class="auth-tab active" onclick="switchTab('login')">登录</button>
            <button class="auth-tab" onclick="switchTab('register')">注册</button>
        </div>
        <div class="auth-form active" id="loginForm">
            <div class="auth-alert" id="loginAlert"></div>
            <form onsubmit="return handleLogin(event)">
                <div class="form-group">
                    <label class="form-label">用户名</label>
                    <input type="text" class="form-control" id="loginUsername" placeholder="请输入用户名" required>
                </div>
                <div class="form-group">
                    <label class="form-label">密码</label>
                    <input type="password" class="form-control" id="loginPassword" placeholder="请输入密码" required>
                </div>
                <button type="submit" class="auth-submit" id="loginBtn">登录</button>
            </form>
        </div>
        <div class="auth-form" id="registerForm">
            <div class="auth-alert" id="registerAlert"></div>
            <form onsubmit="return handleRegister(event)">
                <div class="form-group">
                    <label class="form-label">用户名</label>
                    <input type="text" class="form-control" id="regUsername" placeholder="3-20个字符" required>
                </div>
                <div class="form-group">
                    <label class="form-label">昵称</label>
                    <input type="text" class="form-control" id="regNickname" placeholder="可选">
                </div>
                <div class="form-group">
                    <label class="form-label">密码</label>
                    <input type="password" class="form-control" id="regPassword" placeholder="至少6个字符" required>
                </div>
                <div class="form-group">
                    <label class="form-label">确认密码</label>
                    <input type="password" class="form-control" id="regPasswordConfirm" placeholder="再次输入密码" required>
                </div>
                <button type="submit" class="auth-submit" id="regBtn">创建账号</button>
            </form>
        </div>
    </div>
</div>
<script>
if(localStorage.getItem('token'))window.location.href='/';
function switchTab(t){
    document.querySelectorAll('.auth-tab').forEach(x=>x.classList.remove('active'));
    document.querySelectorAll('.auth-form').forEach(x=>x.classList.remove('active'));
    if(t==='login'){
        document.querySelectorAll('.auth-tab')[0].classList.add('active');
        document.getElementById('loginForm').classList.add('active');
    } else {
        document.querySelectorAll('.auth-tab')[1].classList.add('active');
        document.getElementById('registerForm').classList.add('active');
    }
}
function showAlert(id,msg){
    const e=document.getElementById(id);
    e.textContent=msg;
    e.className='auth-alert show error';
}
async function handleLogin(e){
    e.preventDefault();
    const u=document.getElementById('loginUsername').value.trim();
    const p=document.getElementById('loginPassword').value;
    const b=document.getElementById('loginBtn');
    b.disabled=true;
    b.textContent='登录中...';
    try{
        const r=await fetch('/api/auth/login',{
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({username:u,password:p})
        });
        const d=await r.json();
        if(d.code===0){
            localStorage.setItem('token',d.data.token);
            localStorage.setItem('refreshToken',d.data.refreshToken);
            localStorage.setItem('tokenExpiry',Date.now()+d.data.expiresIn);
            localStorage.setItem('userId',d.data.userId);
            localStorage.setItem('username',d.data.username);
            localStorage.setItem('nickname',d.data.nickname);
            window.location.href='/';
        } else {
            showAlert('loginAlert',d.message);
        }
    } catch(x) {
        showAlert('loginAlert','网络错误，请重试');
    } finally {
        b.disabled=false;
        b.textContent='登录';
    }
    return false;
}
async function handleRegister(e){
    e.preventDefault();
    const u=document.getElementById('regUsername').value.trim();
    const n=document.getElementById('regNickname').value.trim();
    const p=document.getElementById('regPassword').value;
    const c=document.getElementById('regPasswordConfirm').value;
    const b=document.getElementById('regBtn');
    if(p!==c){
        showAlert('registerAlert','密码不匹配');
        return false;
    }
    if(p.length<6){
        showAlert('registerAlert','密码至少6个字符');
        return false;
    }
    b.disabled=true;
    b.textContent='创建中...';
    try{
        const r=await fetch('/api/auth/register',{
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({username:u,password:p,nickname:n})
        });
        const d=await r.json();
        if(d.code===0){
            localStorage.setItem('token',d.data.token);
            localStorage.setItem('refreshToken',d.data.refreshToken);
            localStorage.setItem('tokenExpiry',Date.now()+d.data.expiresIn);
            localStorage.setItem('userId',d.data.userId);
            localStorage.setItem('username',d.data.username);
            localStorage.setItem('nickname',d.data.nickname);
            window.location.href='/';
        } else {
            showAlert('registerAlert',d.message);
        }
    } catch(x) {
        showAlert('registerAlert','网络错误，请重试');
    } finally {
        b.disabled=false;
        b.textContent='创建账号';
    }
    return false;
}
</script>
</body>
</html>
