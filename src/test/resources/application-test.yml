# 测试环境配置：使用 H2 内存数据库，避免依赖外部 PostgreSQL
spring:
  datasource:
    url: jdbc:h2:mem:test_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  ai:
    dashscope:
      api-key: test-api-key
    vectorstore:
      pgvector:
        initialize-schema: false

  sql:
    init:
      mode: never

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto

# JWT 测试密钥
app:
  jwt:
    secret: test-jwt-secret-key-for-unit-tests-only-32bytes!!
    expiration-ms: 3600000

logging:
  level:
    root: WARN
    com.aiservice.aireviewassistant: INFO
